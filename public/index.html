<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>3Q Team Building Lucky Draw</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#171923;--muted:#6b7280;--line:#e5e7eb;--accent:#8b6b34;--accent2:#d7b56d;--danger:#d64545;--ok:#13795b;--shadow:0 14px 38px rgba(20,25,40,.10)}
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.45}.hidden{display:none!important}
    .wrap{width:min(100%,920px);margin:auto;padding:16px 14px 54px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.brand{font-weight:850;letter-spacing:-.02em}.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#c7cad1}.dot.on{background:#22a06b}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.panel-pad{padding:18px}.poster{display:block;width:100%;max-height:680px;object-fit:contain;background:#0b2230}.hero-copy{padding:18px}.hero-copy h1{margin:0 0 8px;font-size:clamp(24px,7vw,38px);line-height:1.05;letter-spacing:-.035em}.hero-copy p{margin:0;color:var(--muted);line-height:1.55}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:750}.tab.active{border-color:var(--accent);background:#fbf8f1;color:#70511f}
    .form{display:grid;gap:10px;margin-top:14px}.label{font-size:13px;font-weight:750}.input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;font-size:16px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,107,52,.12)}
    .btn{min-height:48px;border:0;border-radius:12px;padding:11px 16px;font-weight:800}.btn-primary{background:var(--accent);color:#fff}.btn-soft{background:#f3f4f6;color:#222}.btn-ghost{background:#fff;border:1px solid var(--line)}.btn-danger{background:#fff0f0;color:#b42318;border:1px solid #f4c7c7}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1 1 160px}
    .status{min-height:20px;margin-top:8px;font-size:13px;color:var(--muted)}.status.err{color:var(--danger)}.status.ok{color:var(--ok)}.small{font-size:13px}.muted{color:var(--muted)}
    .room-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.room-code{font-size:28px;font-weight:900;letter-spacing:.12em}.subhead{font-size:13px;color:var(--muted);margin-top:2px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{background:#f7f7f9;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700}
    .game-image{display:block;width:100%;max-height:650px;object-fit:contain;background:#0c2836}.game-caption{padding:17px 18px 18px}.rank{font-size:13px;font-weight:850;color:#805d25}.game-title{font-size:clamp(22px,6vw,34px);font-weight:900;line-height:1.1;margin:4px 0 5px;letter-spacing:-.03em}.game-meta{color:var(--muted);font-size:14px}.intro-note{margin:14px 0 0;padding:12px 13px;border-radius:12px;background:#f8f6f1;color:#5f4c28;font-size:14px;line-height:1.45}
    .count-wrap{text-align:center;padding:30px 10px 24px}.count{font-size:96px;line-height:1;font-weight:950;letter-spacing:-.08em}.count.go{font-size:72px;color:var(--ok);letter-spacing:-.04em}.count-note{margin-top:8px;color:var(--muted);font-weight:700}
    .cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}.draw-card{aspect-ratio:1/1.05;border:1px solid #d7d9df;border-radius:13px;background:linear-gradient(145deg,#fff,#f2eee5);font-weight:900;font-size:17px;color:#6e572d;box-shadow:0 3px 8px rgba(0,0,0,.05);transition:transform .08s ease,opacity .15s ease}.draw-card:active:not(:disabled){transform:scale(.94)}.draw-card.claimed{background:#eceef2;color:#b3b6bd;text-decoration:line-through;box-shadow:none}.draw-card.mine{border:2px solid var(--accent);background:#fff6df;color:#6b4b13;text-decoration:none}.progress{font-size:13px;font-weight:750;color:var(--muted);margin-top:10px;text-align:right}
    .waiting-box{text-align:center;padding:22px 14px}.waiting-icon{font-size:34px}.waiting-title{font-size:20px;font-weight:900;margin:8px 0 4px}.waiting-text{color:var(--muted);line-height:1.45}
    .reveal{padding:24px 18px;text-align:center}.reveal-kicker{font-size:14px;font-weight:850;color:#8a652a}.reveal-title{font-size:clamp(28px,8vw,48px);font-weight:950;line-height:1.05;margin:6px 0 10px;letter-spacing:-.04em}.winner-chip{display:flex;justify-content:center;align-items:center;gap:8px;background:#fff8df;border:1px solid #ead28c;border-radius:14px;padding:12px;margin:8px auto;max-width:520px;font-size:19px;font-weight:900}.loser-note{margin:14px auto 0;color:var(--muted);font-weight:700;max-width:520px}.winner-note{margin:12px auto 0;font-size:20px;font-weight:950;color:#8a5e15}.history{padding:16px 18px;border-top:1px solid var(--line)}.history h3{font-size:14px;margin:0 0 9px}.history-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed #e1e2e6;font-size:13px}.history-row:first-of-type{border-top:0}.history-winners{text-align:right;font-weight:750}
    .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.person{border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;justify-content:space-between;gap:6px;font-size:13px}.person-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.picked{color:var(--ok)}.offline{color:var(--danger)}.waiting{color:var(--muted)}
    .invite{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#f8f9fb;font-size:12px;word-break:break-all;color:#545b6b;margin:10px 0}.host-controls{padding:16px 18px;border-top:1px solid var(--line)}
    #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
    @media (max-width:560px){.wrap{padding-left:10px;padding-right:10px}.panel{border-radius:16px}.panel-pad,.hero-copy,.game-caption{padding-left:14px;padding-right:14px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.draw-card{border-radius:10px;font-size:15px}.people{grid-template-columns:1fr}.room-code{font-size:23px}.count{font-size:82px}}
    @media (max-width:370px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
<canvas id="fx" class="hidden"></canvas>
<div class="wrap">
  <div class="topbar"><div class="brand">3Q Team Building Lucky Draw</div><div id="connectionBadge" class="badge"><span class="dot"></span><span>연결 중</span></div></div>

  <section id="homeView" class="panel">
    <img src="/images/main.jpeg" alt="3분기 조직력 강화 행사 경품 안내" class="poster">
    <div class="hero-copy">
      <h1>다같이 뽑기 🎁</h1>
      <p>한 링크에 접속해서 3 · 2 · 1 후 각자 원하는 카드를 하나씩 고릅니다. 게임마다 당첨 위치는 새로 랜덤 배치됩니다.</p>
      <div class="tabs"><button id="joinTab" class="tab active" type="button">참가하기</button><button id="hostTab" class="tab" type="button">진행자</button></div>
      <div id="joinPanel" class="form">
        <label class="label" for="joinCode">방 코드</label><input id="joinCode" class="input" maxlength="6" placeholder="예: AB12CD" autocomplete="off">
        <label class="label" for="joinName">이름</label><input id="joinName" class="input" maxlength="30" placeholder="이름을 입력해주세요" autocomplete="name">
        <button id="joinBtn" class="btn btn-primary" type="button">입장하기</button><div id="joinStatus" class="status"></div>
      </div>
      <div id="hostPanel" class="form hidden">
        <label class="label" for="hostName">진행자 이름</label><input id="hostName" class="input" maxlength="30" value="진행자">
        <button id="createBtn" class="btn btn-primary" type="button">새 추첨방 만들기</button><div id="createStatus" class="status"></div>
      </div>
    </div>
  </section>

  <section id="playerView" class="hidden">
    <div class="room-head"><div><div class="subhead">ROOM</div><div id="pCode" class="room-code"></div></div><div><div id="playerInfo" style="font-weight:850;text-align:right"></div><div id="playerPhase" class="subhead" style="text-align:right"></div></div></div>
    <div id="playerGamePanel" class="panel"></div>
    <div id="playerHistory" class="panel hidden" style="margin-top:12px"></div>
  </section>

  <section id="hostView" class="hidden">
    <div class="room-head"><div><div class="subhead">진행자 방 코드</div><div id="hCode" class="room-code"></div></div><div class="stats"><span id="playerCount" class="stat">0명</span><span id="hostPhase" class="stat">준비</span></div></div>
    <div class="panel">
      <div id="hostGamePanel"></div>
      <div class="host-controls">
        <div id="inviteLink" class="invite"></div>
        <div class="actions"><button id="copyLink" class="btn btn-ghost" type="button">링크 복사</button><button id="shareLink" class="btn btn-ghost" type="button">초대 공유</button></div>
        <div id="hostActionArea" style="margin-top:10px"></div>
        <div id="hostStatus" class="status"></div>
        <div style="margin-top:16px"><div class="label">참가 현황</div><div id="hostPlayers" class="people"></div></div>
      </div>
      <div id="hostHistory"></div>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const socket = io();
  const qs = new URLSearchParams(location.search);
  let roomCode = null, hostToken = null, mode = null, currentState = null, myPick = null, countdownTimer = null, lastRevealKey = '';

  let playerKey = localStorage.getItem('groupDrawPlayerKey');
  if (!playerKey) { playerKey = (crypto.randomUUID?.() || Date.now() + '-' + Math.random()); localStorage.setItem('groupDrawPlayerKey', playerKey); }

  function show(id){ $(id).classList.remove('hidden'); }
  function hide(id){ $(id).classList.add('hidden'); }
  function setStatus(id,text='',type=''){ const el=$(id); el.textContent=text; el.className='status'+(type?' '+type:''); }
  function esc(v){ return String(v ?? '').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
  function phaseText(s){ return ({intro:'상품 공개',countdown:'3 · 2 · 1',drawing:'선택 중',reveal:'당첨자 공개',finished:'전체 완료'})[s] || s; }
  function gameImage(g){ return g?.image || '/images/main.jpeg'; }

  $('joinTab').addEventListener('click',()=>{ $('joinTab').classList.add('active'); $('hostTab').classList.remove('active'); show('joinPanel'); hide('hostPanel'); });
  $('hostTab').addEventListener('click',()=>{ $('hostTab').classList.add('active'); $('joinTab').classList.remove('active'); show('hostPanel'); hide('joinPanel'); });
  if(qs.get('room')) $('joinCode').value=qs.get('room').toUpperCase().slice(0,6);
  $('joinCode').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));
  ['joinCode','joinName'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') $('joinBtn').click(); }));

  $('createBtn').addEventListener('click',()=>{
    $('createBtn').disabled=true; setStatus('createStatus','방 만드는 중...');
    socket.emit('createRoom',{hostName:$('hostName').value},res=>{
      $('createBtn').disabled=false;
      if(!res?.ok) return setStatus('createStatus',res?.error||'방을 만들지 못했어요.','err');
      roomCode=res.code; hostToken=res.hostToken; mode='host'; currentState=res.state;
      sessionStorage.setItem('groupDrawHost',JSON.stringify({code:roomCode,hostToken}));
      hide('homeView'); show('hostView'); renderHost(res.state); history.replaceState(null,'',location.pathname+'?host='+roomCode);
    });
  });

  $('joinBtn').addEventListener('click',()=>{
    const code=$('joinCode').value.trim().toUpperCase(), name=$('joinName').value.trim();
    $('joinBtn').disabled=true; setStatus('joinStatus','입장 중...');
    socket.emit('joinRoom',{code,name,playerKey},res=>{
      $('joinBtn').disabled=false;
      if(!res?.ok) return setStatus('joinStatus',res?.error||'입장하지 못했어요.','err');
      roomCode=code; mode='player'; currentState=res.state; myPick=res.myPick;
      localStorage.setItem('groupDrawLastJoin',JSON.stringify({code,name}));
      hide('homeView'); show('playerView'); $('pCode').textContent=roomCode; $('playerInfo').textContent=name+'님'; renderPlayer(res.state);
      history.replaceState(null,'',location.pathname+'?room='+roomCode);
    });
  });

  function introHTML(state, host=false){
    const g=state.game;
    return `<img class="game-image" src="${esc(gameImage(g))}" alt="${esc(g.rank+' '+g.prize)}"><div class="game-caption"><div class="rank">GAME ${state.gameIndex+1} · ${esc(g.rank)}</div><div class="game-title">${esc(g.prize)}</div><div class="game-meta">당첨 ${g.winners}명 · 참가 ${state.playerCount}명</div><div class="intro-note">${host?'참가 인원을 확인한 뒤 시작하세요. 첫 게임이 시작되면 참가 명단이 고정됩니다.':'진행자가 시작하면 3 · 2 · 1 뒤 뽑기판이 열립니다. 원하는 카드 하나를 빠르게 골라주세요.'}</div></div>`;
  }

  function countdownHTML(state){ return `<div class="count-wrap"><div class="rank">${esc(state.game.rank)} · ${esc(state.game.prize)}</div><div id="countdown" class="count">3</div><div class="count-note">준비!</div></div>`; }

  function drawingHTML(state, isHost=false){
    const top=`<div class="game-caption"><div class="rank">${esc(state.game.rank)}</div><div class="game-title">${esc(state.game.prize)}</div><div class="game-meta">${state.pickedCount} / ${state.playerCount}명 선택 완료</div></div>`;
    if(isHost) return top+`<div class="waiting-box"><div class="waiting-icon">👀</div><div class="waiting-title">참가자들이 고르는 중</div><div class="waiting-text">모두 한 장씩 고르면 당첨자가 자동으로 공개됩니다.</div></div>`;
    let cards='<div class="cards" id="cards">';
    state.cards.forEach(card=>{ const cls=['draw-card']; if(card.claimed) cls.push('claimed'); if(myPick===card.id) cls.push('mine'); const disabled=state.phase!=='drawing'||card.claimed||myPick!==null; cards+=`<button type="button" class="${cls.join(' ')}" data-card="${card.id}" ${disabled?'disabled':''} aria-label="${card.id+1}번 카드">${card.id+1}</button>`; });
    cards+='</div>';
    const message=myPick===null?'지금! 원하는 카드 하나를 눌러주세요 👆':'선택 완료! 모두 고를 때까지 기다려주세요.';
    return top+`<div class="panel-pad" style="padding-top:0"><div class="intro-note" style="margin-top:0">${message}</div>${cards}<div class="progress">${state.pickedCount} / ${state.playerCount} 선택</div><div id="pickStatus" class="status"></div></div>`;
  }

  function revealHTML(state, playerMode=false){
    const winners=state.winners||[];
    const iWon=playerMode && winners.some(w=>w.cardNumber===myPick+1);
    let chips=winners.map(w=>`<div class="winner-chip">🏆 ${esc(w.name)} <span class="small muted">${w.cardNumber}번</span></div>`).join('');
    let personal='';
    if(playerMode) personal=iWon?'<div class="winner-note">🎉 축하합니다! 당첨되셨습니다! 🎉</div>':'<div class="loser-note">이번 게임은 아쉽지만, 다음 게임이 남아 있어요!</div>';
    return `<img class="game-image" src="${esc(gameImage(state.game))}" alt="${esc(state.game.rank+' '+state.game.prize)}"><div class="reveal"><div class="reveal-kicker">${esc(state.game.rank)} 당첨자</div><div class="reveal-title">축하합니다! 🎊</div>${chips}${personal}</div>`;
  }

  function historyHTML(state){
    if(!state.history?.length) return '';
    const rows=state.history.map(h=>`<div class="history-row"><div><b>${esc(h.rank)}</b><br><span class="muted">${esc(h.prize)}</span></div><div class="history-winners">${h.winners.map(w=>esc(w.name)).join(', ')}</div></div>`).join('');
    return `<div class="history"><h3>🏅 지금까지 당첨자</h3>${rows}</div>`;
  }

  function renderPlayer(state){
    currentState=state; $('playerPhase').textContent=phaseText(state.phase);
    const panel=$('playerGamePanel');
    if(state.phase==='intro') { myPick=null; panel.innerHTML=introHTML(state,false); }
    else if(state.phase==='countdown') { myPick=null; panel.innerHTML=countdownHTML(state); startCountdownUI(state.unlockAt); }
    else if(state.phase==='drawing') { panel.innerHTML=drawingHTML(state,false); bindCardButtons(); }
    else { panel.innerHTML=revealHTML(state,true); maybeCelebrate(state); }
    const hist=$('playerHistory');
    if(state.history?.length){ hist.innerHTML=historyHTML(state); show('playerHistory'); } else hide('playerHistory');
  }

  function bindCardButtons(){ document.querySelectorAll('#cards .draw-card').forEach(b=>b.addEventListener('click',()=>pickCard(Number(b.dataset.card),b))); }
  function pickCard(cardId,button){
    if(myPick!==null) return; button.disabled=true; const s=$('pickStatus'); if(s){s.textContent='선택 확인 중...';s.className='status';}
    socket.emit('pickCard',{code:roomCode,cardId},res=>{
      if(!res?.ok){ if(s){s.textContent=res?.error||'선택하지 못했어요.';s.className='status err';} button.disabled=false; return; }
      myPick=res.cardId; if(s){s.textContent='선택 완료!';s.className='status ok';} if(currentState) renderPlayer(currentState);
    });
  }

  function startCountdownUI(unlockAt){
    clearInterval(countdownTimer);
    const tick=()=>{ const el=$('countdown'); if(!el) return clearInterval(countdownTimer); const left=Math.max(0,unlockAt-Date.now()); const n=Math.ceil(left/1000); if(left<=150){el.textContent='GO!';el.classList.add('go');clearInterval(countdownTimer);} else {el.textContent=Math.min(3,Math.max(1,n));el.classList.remove('go');} };
    tick(); countdownTimer=setInterval(tick,70);
  }

  function renderHost(state){
    currentState=state; $('hCode').textContent=state.code; $('playerCount').textContent=state.playerCount+'명'; $('hostPhase').textContent=phaseText(state.phase);
    $('inviteLink').textContent=location.origin+location.pathname+'?room='+state.code;
    const gp=$('hostGamePanel');
    if(state.phase==='intro') gp.innerHTML=introHTML(state,true);
    else if(state.phase==='countdown') { gp.innerHTML=countdownHTML(state); startCountdownUI(state.unlockAt); }
    else if(state.phase==='drawing') gp.innerHTML=drawingHTML(state,true);
    else { gp.innerHTML=revealHTML(state,false); maybeCelebrate(state); }

    const box=$('hostPlayers'); box.innerHTML='';
    state.players.forEach(p=>{ const cls=p.picked?'picked':(p.online?'waiting':'offline'); const txt=p.picked?'완료':(p.online?'대기':'오프라인'); box.insertAdjacentHTML('beforeend',`<div class="person"><div class="person-name">${esc(p.name)}</div><span class="${cls}">${txt}</span></div>`); });
    if(!state.players.length) box.innerHTML='<div class="muted small">아직 참가자가 없어요.</div>';

    const a=$('hostActionArea');
    if(state.phase==='intro') a.innerHTML=`<button id="startBtn" class="btn btn-primary" type="button" style="width:100%">${state.game.rank} 3 · 2 · 1 시작</button>`;
    else if(state.phase==='countdown'||state.phase==='drawing') a.innerHTML='<button class="btn btn-soft" type="button" style="width:100%" disabled>모두 참여 완료를 기다리는 중...</button>';
    else if(state.phase==='reveal') a.innerHTML='<button id="nextBtn" class="btn btn-primary" type="button" style="width:100%">다음 게임 상품 공개 →</button>';
    else a.innerHTML='<button class="btn btn-soft" type="button" style="width:100%" disabled>🎉 4개 게임 모두 완료!</button>';

    $('startBtn')?.addEventListener('click',()=>{ $('startBtn').disabled=true; setStatus('hostStatus','3 · 2 · 1 시작!','ok'); socket.emit('startCountdown',{code:roomCode,hostToken},res=>{if(!res?.ok)setStatus('hostStatus',res?.error||'시작하지 못했어요.','err');}); });
    $('nextBtn')?.addEventListener('click',()=>{ $('nextBtn').disabled=true; socket.emit('nextGame',{code:roomCode,hostToken},res=>{if(!res?.ok)setStatus('hostStatus',res?.error||'다음 게임으로 넘어가지 못했어요.','err');}); });
    $('hostHistory').innerHTML=historyHTML(state);
  }

  $('copyLink').addEventListener('click',async()=>{ const text=$('inviteLink').textContent; try{await navigator.clipboard.writeText(text);setStatus('hostStatus','초대 링크를 복사했어요.','ok');}catch{window.prompt('이 링크를 복사해주세요.',text);} });
  $('shareLink').addEventListener('click',async()=>{ const url=$('inviteLink').textContent; if(navigator.share){try{await navigator.share({title:'3Q Team Building Lucky Draw',text:'방 코드 '+roomCode,url});}catch{}}else $('copyLink').click(); });

  function maybeCelebrate(state){
    const key=state.code+'-'+state.gameIndex+'-'+state.phase;
    if((state.phase!=='reveal'&&state.phase!=='finished')||lastRevealKey===key) return;
    lastRevealKey=key; fireworks();
  }

  function fireworks(){
    const canvas=$('fx'),ctx=canvas.getContext('2d'); if(!ctx) return; show('fx');
    const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight; canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.scale(dpr,dpr);
    const colors=['#f6c453','#ef476f','#06d6a0','#118ab2','#9b5de5','#ff8fab','#ffd166']; const particles=[];
    for(let burst=0;burst<7;burst++){ const cx=w*(.12+Math.random()*.76),cy=h*(.12+Math.random()*.45); const color=colors[burst%colors.length]; for(let i=0;i<44;i++){ const a=Math.random()*Math.PI*2,s=2.2+Math.random()*5.2; particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*35,r:1.5+Math.random()*2.4,c:color}); } }
    let frame=0; function draw(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{if(p.life<=0)return;p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.992;p.life--;ctx.globalAlpha=Math.max(0,p.life/90);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;frame++;if(frame<120)requestAnimationFrame(draw);else{ctx.clearRect(0,0,w,h);hide('fx');}} draw();
  }

  socket.on('roomState',state=>{ if(mode==='player'&&state.code===roomCode){ if(state.gameIndex!==currentState?.gameIndex) myPick=null; renderPlayer(state); } });
  socket.on('hostState',state=>{ if(mode==='host'&&state.code===roomCode) renderHost(state); });
  socket.on('connect',()=>{ const b=$('connectionBadge'); b.querySelector('.dot')?.classList.add('on'); b.querySelector('span').textContent='연결됨'; tryResumeHost(); tryResumePlayer(); });
  socket.on('disconnect',()=>{ const b=$('connectionBadge'); b.querySelector('.dot')?.classList.remove('on'); b.querySelector('span').textContent='재연결 중'; });

  function tryResumeHost(){
    if(mode) return; const raw=sessionStorage.getItem('groupDrawHost'); if(!raw) return; let saved; try{saved=JSON.parse(raw)}catch{return} if(qs.get('host')!==saved.code) return;
    socket.emit('resumeHost',saved,res=>{ if(!res?.ok)return; roomCode=saved.code;hostToken=saved.hostToken;mode='host';hide('homeView');show('hostView');renderHost(res.state); });
  }
  function tryResumePlayer(){
    if(mode||!qs.get('room')) return; const raw=localStorage.getItem('groupDrawLastJoin'); if(!raw) return; let saved; try{saved=JSON.parse(raw)}catch{return} if(saved.code!==qs.get('room').toUpperCase()) return;
    socket.emit('joinRoom',{code:saved.code,name:saved.name,playerKey},res=>{ if(!res?.ok)return;roomCode=saved.code;mode='player';currentState=res.state;myPick=res.myPick;hide('homeView');show('playerView');$('pCode').textContent=roomCode;$('playerInfo').textContent=saved.name+'님';renderPlayer(res.state); });
  }
})();
</script>
</body>
</html>
